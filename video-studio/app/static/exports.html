<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exports — Video Studio</title>
<link rel="stylesheet" href="/static/vs.css">
<script src="/static/vs-nav.js" defer></script>
<style>
  * { box-sizing:border-box; margin:0; }
  body { background:radial-gradient(1100px 500px at 75% -10%, #1a2036 0%, var(--bg) 55%);
         color:var(--text); min-height:100vh; }
  a { color:var(--accent2); text-decoration:none; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .fbtn { background:var(--panel2); border:1px solid var(--line); color:var(--dim);
          border-radius:14px; padding:6px 14px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .fbtn.on { color:var(--text); border-color:var(--accent); }
  .kind { display:inline-block; border-radius:9px; padding:2px 9px; font-size:10.5px;
          font-weight:800; letter-spacing:.4px; text-transform:uppercase; }
  .kind.vsl { background:#2b2153; color:#b9a5ff; }
  .kind.edit { background:#15323c; color:#7fd9f5; }
  .kind.dub { background:#14332a; color:#63e2ac; }
  .kind.dub-captioned { background:#14332a; color:#63e2ac; }
  .kind.captioned { background:#3b2b18; color:#ffc97e; }
  .rowbtn { background:var(--panel2); border:1px solid var(--line); color:var(--text);
            border-radius:8px; padding:4px 12px; font-size:12px; font-weight:700; cursor:pointer; }
  .rowbtn:hover { border-color:var(--accent); }
  .hint { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<div class="vs-page">
  <h2>Exports</h2>
  <p class="lead">Every finished deliverable in one place. “Send to Desktop” copies into
    <b id="exdir" style="color:var(--accent2)">Desktop\Video Studio</b> — the one folder that
    replaces the scattered old ones.</p>

  <div class="vs-chips" id="chips"></div>
  <div class="filters" id="filters"></div>

  <div class="vs-panel">
    <table class="vs-table">
      <thead><tr><th>Type</th><th>Deliverable</th><th>When</th><th>Size</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="hint" style="display:none; padding:14px 4px">Nothing rendered yet.</div>
  </div>
</div>
<script>
let ITEMS = [], FILTER = "all";
const $ = id => document.getElementById(id);
const KINDS = { vsl:"VSL render", edit:"Edit", dub:"Dub", "dub-captioned":"Dub+captions", captioned:"Captioned" };
const when = ts => new Date(ts * 1000).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});

function render() {
  const rows = $("rows");
  rows.innerHTML = "";
  const vis = ITEMS.filter(i => FILTER === "all" || i.kind === FILTER);
  $("empty").style.display = vis.length ? "none" : "block";
  for (const it of vis) {
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td><span class="kind ${it.kind}">${KINDS[it.kind] || it.kind}</span></td>
       <td style="font-weight:600">${it.label}</td>
       <td class="hint">${when(it.mtime)}</td>
       <td class="hint">${(it.size/1048576).toFixed(1)} MB</td>
       <td style="text-align:right; white-space:nowrap">
         <a class="rowbtn" href="${it.view}" target="_blank">▶ view</a>
         <button class="rowbtn" onclick='send(${JSON.stringify(it).replace(/'/g, "&#39;")}, this)'>📤 Send to Desktop</button>
       </td>`;
    rows.appendChild(tr);
  }
}

async function send(it, btn) {
  btn.disabled = true; btn.textContent = "…";
  const body = it.kind === "captioned" ? {kind:"captioned", stem: it.stem} : {path: it.path};
  const r = await fetch("/api/exports/send", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  if (!r.ok) { alert(await r.text()); btn.disabled = false; btn.textContent = "📤 Send to Desktop"; return; }
  btn.textContent = "✓ on Desktop";
}

async function load() {
  const d = await (await fetch("/api/exports")).json();
  ITEMS = d.items || [];
  $("exdir").textContent = d.exports_dir;
  const counts = {};
  let bytes = 0;
  for (const i of ITEMS) { counts[i.kind] = (counts[i.kind] || 0) + 1; bytes += i.size; }
  $("chips").innerHTML =
    `<div class="vs-chip"><b>${ITEMS.length}</b><span>deliverables</span></div>
     <div class="vs-chip"><b>${(bytes/1073741824).toFixed(2)} GB</b><span>total</span></div>`;
  const f = $("filters");
  f.innerHTML = "";
  const mk = (key, label) => {
    const b = document.createElement("button");
    b.className = "fbtn" + (FILTER === key ? " on" : "");
    b.textContent = label;
    b.onclick = () => { FILTER = key; load(); };
    f.appendChild(b);
  };
  mk("all", `All (${ITEMS.length})`);
  for (const k of Object.keys(KINDS)) if (counts[k]) mk(k, `${KINDS[k]} (${counts[k]})`);
  render();
}
load();
</script>
</body>
</html>
