<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Remote — Video Studio</title>
<link rel="stylesheet" href="/static/vs.css">
<style>
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { background:radial-gradient(900px 500px at 50% -10%, #1a2036 0%, var(--bg) 55%);
         color:var(--text); min-height:100vh; font:15px/1.5 'Segoe UI',system-ui,sans-serif;
         padding:16px 14px 40px; }
  a { color:var(--accent2); text-decoration:none; }
  header { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  header .logo { font-size:19px; font-weight:800; } header .logo b { color:var(--accent); }
  header .sp { margin-left:auto; }
  .pill { background:var(--panel2); border:1px solid var(--line); border-radius:20px;
          padding:7px 14px; font-size:13px; font-weight:700; color:var(--text); }
  h3 { font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim);
       margin:20px 2px 10px; }
  .chips { display:flex; gap:10px; }
  .chip { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:12px 8px; text-align:center; }
  .chip b { display:block; font-size:20px; } .chip span { color:var(--dim); font-size:11px; }
  .job { background:var(--panel); border:1px solid var(--line); border-radius:14px;
         padding:13px 14px; margin-bottom:10px; }
  .job .top { display:flex; align-items:center; gap:8px; }
  .job .nm { font-weight:700; font-size:14px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .job .st { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; }
  .st.running { color:var(--accent2); } .st.done { color:var(--ok); }
  .st.failed { color:var(--bad); } .st.stopped,.st.interrupted,.st.issues { color:var(--warn); }
  .bar { height:8px; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
         overflow:hidden; margin-top:9px; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .5s; }
  .row2 { display:flex; align-items:center; gap:8px; margin-top:9px; }
  .when { color:var(--dim); font-size:11px; flex:1; }
  .btn { border:1px solid var(--line); background:var(--panel2); color:var(--text);
         border-radius:10px; padding:8px 14px; font-size:13px; font-weight:700; }
  .btn.stop { color:var(--bad); border-color:var(--bad); }
  .btn.resume { color:var(--ok); border-color:var(--ok); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:16px 12px; text-align:center; font-weight:700; font-size:14px; }
  .tile:active { border-color:var(--accent); }
  .tile .ico { font-size:24px; display:block; margin-bottom:6px; }
  .muted { color:var(--dim); font-size:12px; padding:8px 2px; }
</style>
</head>
<body>
<header>
  <span class="logo">Video <b>Studio</b></span>
  <span class="sp"></span>
  <span class="pill" id="health">•••</span>
  <span class="pill" id="logout" onclick="logout()">Lock</span>
</header>

<div class="chips">
  <div class="chip"><b id="c-running">0</b><span>running</span></div>
  <div class="chip"><b id="c-done">0</b><span>done today</span></div>
  <div class="chip"><b id="c-spend">$0</b><span>fal.ai spent</span></div>
</div>

<h3>Live jobs</h3>
<div id="jobs"></div>
<div class="muted" id="nojobs" style="display:none">No jobs running. Start one below.</div>

<h3>Open a tab</h3>
<div class="grid">
  <a class="tile" href="/library"><span class="ico">🎬</span>Library</a>
  <a class="tile" href="/new"><span class="ico">📥</span>New Project</a>
  <a class="tile" href="/dubsync"><span class="ico">🔧</span>DubSync Repair</a>
  <a class="tile" href="/captions"><span class="ico">💬</span>Captions</a>
  <a class="tile" href="/brand-studio"><span class="ico">🎨</span>Brand Studio</a>
  <a class="tile" href="/exports"><span class="ico">📦</span>Exports</a>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = ts => ts ? new Date(ts*1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : "";
const todayStart = new Date(); todayStart.setHours(0,0,0,0);

async function logout(){ await fetch("/api/logout",{method:"POST"}); location.href="/login"; }

async function act(id, verb, btn){
  btn.disabled = true; btn.textContent = "…";
  try { const r = await fetch(`/api/job/${id}/${verb}`,{method:"POST"}); if(!r.ok) alert(await r.text()); }
  finally { refresh(); }
}

async function refresh(){
  let jobs = [];
  try { jobs = await (await fetch("/api/jobs")).json(); }
  catch { $("health").textContent = "offline"; return; }
  $("health").textContent = "online";
  jobs.sort((a,b)=>(b.started||0)-(a.started||0));
  const running = jobs.filter(j=>j.status==="running");
  const doneToday = jobs.filter(j=>j.status==="done" && (j.ended||0)*1000>=todayStart.getTime());
  $("c-running").textContent = running.length;
  $("c-done").textContent = doneToday.length;

  const box = $("jobs"); box.innerHTML="";
  const show = jobs.slice(0,12);
  $("nojobs").style.display = show.length ? "none" : "block";
  for(const j of show){
    const pct = j.progress && j.progress.pct!=null ? j.progress.pct : null;
    let actions = "";
    if(j.status==="running") actions = `<button class="btn stop" onclick="act('${j.id}','stop',this)">Stop</button>`;
    else if(["interrupted","failed","stopped"].includes(j.status) && j.cmd) actions = `<button class="btn resume" onclick="act('${j.id}','resume',this)">Resume</button>`;
    const el = document.createElement("div"); el.className="job";
    el.innerHTML =
      `<div class="top"><span class="nm">${j.label||j.action}</span>
         <span class="st ${j.status}">${j.status}</span></div>
       ${pct!=null ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}
       <div class="row2"><span class="when">${fmt(j.started)}${j.progress&&j.progress.label?" · "+j.progress.label:""}</span>${actions}</div>`;
    box.appendChild(el);
  }
  try { const s = await (await fetch("/api/spend")).json(); $("c-spend").textContent = "$"+(s.total??0).toFixed(2); } catch {}
}
refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
